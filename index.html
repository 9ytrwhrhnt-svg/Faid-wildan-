<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دعوة زفاف</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #120508; color: #fff; text-align: center; }
    .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle, #4a101d 0%, #120508 100%); padding: 20px; }
    .sub-title { color: #e2b97c; font-size: 1.2rem; margin-bottom: 10px; }
    .names { font-size: 2.8rem; color: #fce4ec; margin-bottom: 30px; font-weight: bold; }
    .btn-tap { background: linear-gradient(45deg, #e2b97c, #c59b56); color: #120508; border: none; padding: 14px 35px; border-radius: 30px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
    .details { display: none; padding: 60px 20px; background: #1a080c; }
    .card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(226, 185, 124, 0.3); padding: 30px 20px; border-radius: 20px; max-width: 450px; margin: 0 auto; }
    .card h2 { color: #e2b97c; margin-bottom: 20px; }
    .info-item { font-size: 1.2rem; margin: 15px 0; }
  </style>
</head>
<body>
  <div class="hero">
    <div class="sub-title">دعوة زفاف</div>
    <div class="names">مصطفى & مريم</div>
    <button class="btn-tap" onclick="openInv()">💍 اضغط لفتح الدعوة</button>
  </div>
  <div class="details" id="sec">
    <div class="card">
      <h2>بطاقة دعوة</h2>
      <p>يسرنا حضوركم حفل زفافنا</p>
      <div class="info-item">📅 الجمعة</div>
      <div class="info-item">⏰ 7:00 مساءً</div>
      <div class="info-item">📍 قاعة الأفراح</div>
    </div>
  </div>
  <script>
    function openInv() {
      document.getElementById('sec').style.display = 'block';
      document.getElementById('sec').scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
